[project]
name = "agentguard"
version = "0.1.0"
description = "Capability-based permission engine, taint tracking and tamper-evident audit for LLM agent tool calls"
readme = "README.md"
license = "MIT"
authors = [{ name = "agentguard contributors" }]
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.2",
]

[project.scripts]
agentguard = "agentguard.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis==6.122.3",
    "mypy==1.14.1",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "types-pyyaml==6.0.12.20241230",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PIE", "PT", "RET", "TRY", "PL"]
ignore = [
    "PLR0911", # many returns is clearer for decision functions
    "PLR0912",
    "PLR0913",
    "PLR2004",
    "TRY003",  # explicit messages on custom exceptions are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "S101", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "benchmarks"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
markers = ["ollama: requires a running local Ollama server (never part of make check)"]

[tool.coverage.run]
source = ["agentguard"]
branch = true
omit = ["src/agentguard/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
