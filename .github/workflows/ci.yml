name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: make check (format, lint, mypy --strict, tests + coverage >= 85%)
        run: make check
      - name: make demo (offline end-to-end)
        run: make demo
      - name: Property tests, thorough profile
        run: make fuzz
